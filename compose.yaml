services:
   # nome do serviço exibido na interface e pelos comandos do Docker
   mcp-inspector:
     # executa o "build" da imagem definido no arquivo "Dockerfile"
     build:
       context: .
       dockerfile: Dockerfile
     # nome do contêiner 
     container_name: mcp-inspector
     # servidor/ip e porta em que a aplicação responderá
     ports:
       - "127.0.0.1:6274:6274"
     # 
     # ro: read-only
     volumes:
       - ./server:/opt/mcp/server:ro
       # banco de dados do servidor MCP, que precisa de um local com permissão
       # de escrita e é preservado entre as execuções do contêiner
       - mcp-academico-dados:/home/node/.mcp-academico
     # executa o servidor MCP em Java
     command:
       - java
       - -jar
       - /opt/mcp/server/mcp_academico_server.jar

volumes:
   mcp-academico-dados:
